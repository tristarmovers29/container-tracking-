
<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycbzNyAKEbexR9_NGYCrUrG0K7aVgPbDarDMFHFK0fiIo8dnrjrxGyOaD2no-EMsKCYA/exec";

function trackContainer() {
  const input = document.getElementById("containerNo");
  const no = input.value.trim().toUpperCase();
  const err = document.getElementById("error");
  const welcome = document.getElementById("welcome");
  const result = document.getElementById("result");

  err.classList.add("hidden");
  result.classList.add("hidden");

  if (!no) {
    showError("Please enter a container number.");
    return;
  }

  welcome.classList.add("hidden");
  err.classList.add("hidden");

  const button = document.querySelector(".search button");
  button.disabled = true;
  button.textContent = "TRACKING...";

  const callbackName =
    "trackingCallback_" + Date.now();

  const script = document.createElement("script");
  const timeout = setTimeout(() => {
    cleanup();
    showError("Request timed out. Please try again.");
  }, 45000);

  function cleanup() {
    clearTimeout(timeout);
    script.remove();
    delete window[callbackName];
    button.disabled = false;
    button.textContent = "TRACK CONTAINER";
  }

  window[callbackName] = function(response) {
    cleanup();

    if (!response || !response.success) {
      const detail = response &&
        (response.error || response.message);

      showError(detail || "Tracking request failed.");
      return;
    }

    const shipment = response.data &&
      response.data.shipment;

    if (!shipment) {
      showError(
        "No shipment record was returned for " + no + "."
      );
      return;
    }

    renderShipment(shipment, no);
  };

  script.onerror = function() {
    cleanup();
    showError(
      "Could not connect to tracking service. Please try again."
    );
  };

  script.src =
    API_URL +
    "?action=track" +
    "&referenceNumber=" + encodeURIComponent(no) +
    "&callback=" + encodeURIComponent(callbackName);

  document.body.appendChild(script);
}

function renderShipment(s, searchedNumber) {
  const route = s.route || {};
  const shipmentStatus = s.status || "UNKNOWN";

  const origin =
    route.portOfLoading?.location ||
    route.placeOfReceipt?.location || {};

  const destination =
    route.portOfDischarge?.location || {};

  const departure = route.portOfLoading?.departure || {};
  const arrival = route.portOfDischarge?.arrival || {};

  const transport =
    arrival.transport || departure.transport || {};

  const container =
    s.references?.containerNumber ||
    searchedNumber;

  set("rContainer", container);
  set("rStatus", shipmentStatus.replace(/_/g, " "));
  set("rLine", s.carrier?.name || "Not available");
  set("rVessel", transport.name || "Not available");
  set("rVoyage", transport.voyageNumber || "Not available");

  set(
    "rLocation",
    destination.name ||
    origin.name ||
    "Location not available"
  );

  set("rETD", formatDate(departure.date));
  set("rETA", formatDate(arrival.date));
  set("rUpdated", formatDate(s.updatedAt, true));
  set("rType", s.equipment?.type || s.containerType || "Not available");
  set("rPOL", origin.name || "Not available");
  set("rPOD", destination.name || "Not available");

  const timeline = document.getElementById("timeline");
  timeline.innerHTML = "";

  const events = Array.isArray(s.events) ? s.events : [];

  if (events.length) {
    events.forEach(event => {
      addEvent(
        formatDate(event.date || event.eventDate),
        event.description || event.eventType || event.status || "Shipment update",
        event.location?.name || event.location || ""
      );
    });
  } else {
    addEvent(
      formatDate(s.updatedAt, true),
      shipmentStatus.replace(/_/g, " "),
      "Latest status reported by the tracking provider."
    );

    if (departure.date) {
      addEvent(
        formatDate(departure.date),
        departure.isActual ? "Vessel Departed" : "Estimated Departure",
        origin.name || ""
      );
    }

    if (arrival.date) {
      addEvent(
        formatDate(arrival.date),
        arrival.isActual ? "Arrived" : "Estimated Arrival",
        destination.name || ""
      );
    }
  }

  document.getElementById("result").classList.remove("hidden");
}

function addEvent(date, title, description) {
  const timeline = document.getElementById("timeline");
  const item = document.createElement("div");
  item.className = "event";

  const dateEl = document.createElement("div");
  dateEl.className = "date";
  dateEl.textContent = date || "Date unavailable";

  const titleEl = document.createElement("h4");
  titleEl.textContent = title || "Shipment update";

  const descEl = document.createElement("p");
  descEl.textContent = description || "";

  item.append(dateEl, titleEl, descEl);
  timeline.appendChild(item);
}

function formatDate(value, includeTime) {
  if (!value) return "Not available";

  const date = new Date(value);
  if (isNaN(date.getTime())) return String(value);

  const options = {
    day: "2-digit",
    month: "short",
    year: "numeric"
  };

  if (includeTime) {
    options.hour = "2-digit";
    options.minute = "2-digit";
  }

  return date.toLocaleString("en-GB", options);
}

function set(id, value) {
  document.getElementById(id).textContent =
    value == null || value === "" ? "Not available" : value;
}

function showError(message) {
  const err = document.getElementById("error");
  err.textContent = message;
  err.classList.remove("hidden");
}

document.getElementById("containerNo")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") trackContainer();
  });
</script>
